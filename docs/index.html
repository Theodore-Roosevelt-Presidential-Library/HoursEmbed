<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoursEmbed demo — Salt + Scoria</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: Georgia, serif; margin: 0; }
    h1, h2 { font-family: "Arial Narrow", Impact, sans-serif; text-transform: uppercase; }
    section { padding: 40px 20px; }
    section > div { max-width: 720px; margin: 0 auto; }
    .scoria { background: #b63d25; color: #fafafa; }
    .charcoal { background: #242729; color: #fafafa; }
    .light { background: #ffffff; }
    code { background: rgba(127,127,127,.2); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
  </style>
</head>
<body>
  <section class="scoria">
    <div>
      <h2>Auto theme on a scoria-red section</h2>
      <p>The widget detects the background and switches to light-on-dark,
         tinting the active tab with the section's own red.</p>
      <div data-trpl-hours></div>
    </div>
  </section>

  <section class="charcoal">
    <div>
      <h2>Auto theme on charcoal</h2>
      <div data-trpl-hours data-heading="hide"></div>
    </div>
  </section>

  <section class="light">
    <div>
      <h2>Auto theme on white</h2>
      <p>Falls back to the dark-text light palette. Force any palette with
         <code>data-theme="light|dark|scoria"</code>.</p>
      <div data-trpl-hours></div>
    </div>
  </section>

  <script src="./embed.js" defer></script>
</body>
</html>
