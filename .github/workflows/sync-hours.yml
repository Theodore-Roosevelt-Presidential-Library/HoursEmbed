name: Sync hours from trlibrary.com

on:
  schedule:
    - cron: "17 9 */3 * *" # every 3 days at 9:17 UTC (~3:17am Medora)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/extract-hours.mjs"

permissions:
  contents: write

concurrency:
  group: sync-hours
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract hours
        run: node scripts/extract-hours.mjs

      - name: Commit updated hours.json
        run: |
          if git diff --quiet docs/hours.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "hours-sync[bot]"
          git config user.email "actions@github.com"
          git add docs/hours.json
          git commit -m "chore: sync hours from trlibrary.com"
          git push
